name: CI Fast - Godot 4.7.2
on:
  push:
    branches: [master, 'refactor/**', 'ci/**', 'integration/**', 'handoff/**', 'ui/**']
    paths:
      - '.github/workflows/ci-fast.yml'
      - 'tools/ci/**'
      - 'tools/qa/**'
      - 'tools/balance/**'
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'resources/**'
      - 'addons/**'
      - 'assets/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci-fast.yml'
      - 'tools/ci/**'
      - 'tools/qa/**'
      - 'tools/balance/**'
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'resources/**'
      - 'addons/**'
      - 'assets/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup cached Godot 4.7.2 and imported assets
        uses: ./.github/actions/setup-godot-ci
      - name: Headless import, log-gate unit tests and representative battle/UI smoke
        # This branch's Fast batch reached its third execution at 77bd22a.
        # Preserve the failed Lv40 gate; additional reruns need owner approval.
        if: github.ref != 'refs/heads/ui/v35-convergence-final-20261016' || github.sha == '81f3d941ae033f9c6523c8fdb2e7049e4cf023d4' || github.sha == '77bd22a7bcece1fc7b9cef3360aebfa5fa2dc01c'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/fast-logs"
          python3 -m unittest discover -s tests/ci -p 'test_*.py' -v > "$RUNNER_TEMP/fast-logs/ci-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/fast-logs/ci-tests.log"; exit 1;
          }
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/fast-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/fast-logs/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/fast-logs/import.log"
          for spec in \
            'test_m5_integration:M5_5_INTEGRATION_REPORT:32' \
            'test_m5_replay:M5_5_REPLAY_REPORT:15' \
            'test_m5_fast_seeds:M5_5_FAST_SEEDS_REPORT:5' \
            'test_lv40_roster:CURRENT_ROSTER_REPORT:36' \
            'test_p4_scene:P4_1_REPORT:8' \
            'test_p4_hud:P4_2_REPORT:36' \
            'test_p4_integration:P4_3_REPORT:31' \
            'test_p4_lv40_playable:P4_LV40_PLAYABLE_REPORT:32' \
            'test_screenshot_writer:SCREENSHOT_WRITER_REPORT:46'; do
            bash tools/ci/run_suite.sh "$spec" "$RUNNER_TEMP/fast-logs"
          done
          echo 'CI_FAST_VERIFIED (Headless only)'
      - name: New Last Spell cut-in GUI gate
        if: github.ref == 'refs/heads/ui/v35-convergence-final-20261016'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/fast-logs"
          if [ ! -f .godot/global_script_class_cache.cfg ]; then
            timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/fast-logs/last-import.log" 2>&1
            python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/fast-logs/last-import.log"
          fi
          log="$RUNNER_TEMP/fast-logs/last-preview-gui.log"
          timeout 150s xvfb-run -a -s '-screen 0 1920x1080x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --script res://tests/test_last_spell_preview.gd > "$log" 2>&1 || {
              cat "$log"; exit 1;
            }
          python3 tools/ci/assert_godot_logs.py "$log"
          grep -Fx 'LAST_PREVIEW_REPORT executed=25 passed=25 failed=0' "$log"
      - name: Upload fast CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-logs
          path: ${{ runner.temp }}/fast-logs/
          retention-days: 7