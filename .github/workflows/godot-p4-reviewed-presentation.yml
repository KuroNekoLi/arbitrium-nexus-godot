name: Godot P4 reviewed presentation contracts
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  presentation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/p4-contracts"
          url="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$url/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$url/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          exe="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          echo "GODOT_BIN=$exe" >> "$GITHUB_ENV"
      - name: Strict import and baseline presentation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/p4-contracts/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/p4-contracts/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/p4-contracts/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/p4-contracts/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/p4-contracts/import.log"
          for spec in \
            'test_p4_localization:P4_LOCALIZATION_REPORT:198' \
            'test_p4_lv40_readmodel:P4_READMODEL_REPORT:29' \
            'test_p4_scene:P4_1_REPORT:8' \
            'test_p4_hud:P4_2_REPORT:36' \
            'test_p4_integration:P4_3_REPORT:31'; do
            IFS=: read -r suite label count <<< "$spec"
            log="$RUNNER_TEMP/p4-contracts/$suite.log"
            timeout 140s "$GODOT_BIN" --headless --path . --script "res://tests/$suite.gd" > "$log" 2>&1 || {
              cat "$log"; exit 1;
            }
            grep -qx "$label executed=$count passed=$count failed=0" "$log" || {
              cat "$log"; exit 1;
            }
            python3 tools/ci/assert_godot_logs.py "$log"
            grep "^$label" "$log"
          done
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-presentation-contracts
          path: ${{ runner.temp }}/p4-contracts/
          retention-days: 14
