name: Godot Phase3 M2.1 - resource domain

# M2.1 resource-only gate. This is NOT complete M2 or full combat acceptance.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/godot-m2-resources.yml'
      - 'scripts/domain/m1/**'
      - 'scripts/domain/m2/economy/**'
      - 'tests/test_m2_resources.gd'
      - 'resources/combat/rulesets/m2_1_provisional_resources.json'
      - 'project.godot'
  pull_request:
    paths:
      - '.github/workflows/godot-m2-resources.yml'
      - 'scripts/domain/m1/**'
      - 'scripts/domain/m2/economy/**'
      - 'tests/test_m2_resources.gd'
      - 'resources/combat/rulesets/m2_1_provisional_resources.json'
      - 'project.godot'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 official binary and verify SHA-512
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m2-logs"
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          ZIP="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$URL/$ZIP" -o "$RUNNER_TEMP/godot/$ZIP"
          curl -fLsS --retry 3 "$URL/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$ZIP" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$ZIP" -d extracted
          BIN="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Verify engine and import
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m2-logs/version.txt"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m2-logs/version.txt"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m2-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-logs/import.log"
            exit 1
          }
      - name: M1 Domain regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_combat_m1.gd > "$RUNNER_TEMP/m2-logs/m1-regression.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-logs/m1-regression.log"
            exit 1
          }
          cat "$RUNNER_TEMP/m2-logs/m1-regression.log"
          grep -q 'M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m2-logs/m1-regression.log"
      - name: M2.1 Resource Domain cases
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_m2_resources.gd > "$RUNNER_TEMP/m2-logs/m2.1-resources.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-logs/m2.1-resources.log"
            exit 1
          }
          cat "$RUNNER_TEMP/m2-logs/m2.1-resources.log"
          grep -Eq 'M2_1_TEST_REPORT executed=[0-9]+ passed=[0-9]+ failed=0 skipped=0' "$RUNNER_TEMP/m2-logs/m2.1-resources.log"
          grep -q 'M2_1_REPLAY_PROOF' "$RUNNER_TEMP/m2-logs/m2.1-resources.log"
      - name: Save verifiable CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m2-1-logs
          path: ${{ runner.temp }}/m2-logs/
          if-no-files-found: warn
          retention-days: 14
