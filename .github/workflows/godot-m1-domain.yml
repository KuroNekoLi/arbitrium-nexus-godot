name: Godot Phase3 M1 - domain contract

# New M1 Domain scaffold, separate from existing legacy battle tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-m1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 with verified SHA-512
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m1-logs"
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          ZIP="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$URL/$ZIP" -o "$RUNNER_TEMP/godot/$ZIP"
          curl -fLsS --retry 3 "$URL/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$ZIP" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$ZIP" -d extracted
          BIN="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          printf 'GODOT_BIN=%s\n' "$BIN" >> "$GITHUB_ENV"

      - name: Verify Godot binary and import project
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f project.godot
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m1-logs/version.txt"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m1-logs/version.txt"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m1-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m1-logs/import.log"
            exit 1
          }

      - name: Run M1 Domain test cases
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_combat_m1.gd > "$RUNNER_TEMP/m1-logs/m1-cases.log" 2>&1 || {
            cat "$RUNNER_TEMP/m1-logs/m1-cases.log"
            exit 1
          }
          cat "$RUNNER_TEMP/m1-logs/m1-cases.log"
          grep -q 'M1_TEST_REPORT' "$RUNNER_TEMP/m1-logs/m1-cases.log"
          grep -q 'failed=0' "$RUNNER_TEMP/m1-logs/m1-cases.log"
          grep -q 'M1_REPLAY_PROOF' "$RUNNER_TEMP/m1-logs/m1-cases.log"

      - name: Upload actual M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m1-logs
          path: ${{ runner.temp }}/m1-logs/
          if-no-files-found: warn
          retention-days: 14
