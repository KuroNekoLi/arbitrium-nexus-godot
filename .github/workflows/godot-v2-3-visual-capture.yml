name: CI Visual - Real Godot Battle Screenshots
on:
  push:
    branches: [master, 'ui/v2-layout-fidelity-20261015', 'integration/v2-reviewed-20261015', 'integration/v3-reviewed-20261015', 'integration/v34-reviewed-20261015']
    paths:
      - '.github/workflows/godot-v2-3-visual-capture.yml'
      - '.github/actions/setup-godot-ci/**'
      - 'tools/ci/**'
      - 'project.godot'
      - 'tests/visual_baselines/**'
      - 'tests/capture_p4_v23_layout.gd'
      - 'tests/capture_p4_v31_boss.gd'
      - 'tests/test_p4_v26_pending_ux.gd'
      - 'tests/fixtures/m5_full_battle_fixture.gd'
      - 'scripts/qa/screenshot_writer.gd'
      - 'scripts/battle/battle_screen.gd'
      - 'scripts/battle/presentation/**'
      - 'scripts/battle/ui/**'
      - 'scripts/ui/**'
      - 'scenes/battle/**'
      - 'resources/ui/**'
      - 'assets/**'
      - 'addons/**'
  pull_request:
    paths:
      - '.github/workflows/godot-v2-3-visual-capture.yml'
      - '.github/actions/setup-godot-ci/**'
      - 'tools/ci/**'
      - 'project.godot'
      - 'tests/visual_baselines/**'
      - 'tests/capture_p4_v23_layout.gd'
      - 'tests/capture_p4_v31_boss.gd'
      - 'tests/fixtures/m5_full_battle_fixture.gd'
      - 'scripts/qa/screenshot_writer.gd'
      - 'scripts/battle/battle_screen.gd'
      - 'scripts/battle/presentation/**'
      - 'scripts/battle/ui/**'
      - 'scripts/ui/**'
      - 'scenes/battle/**'
      - 'resources/ui/**'
      - 'assets/**'
      - 'addons/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-visual-${{ github.ref }}
  # Do not cancel the explicitly limited historical V26 branch attempt.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/integration/v2-reviewed-20261015' }}
jobs:
  v23-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Setup cached and SHA-512 verified Godot 4.7.2
        uses: ./.github/actions/setup-godot-ci
      - name: Prepare Xvfb and import Godot assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v23"
          if ! command -v xvfb-run >/dev/null || ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          fi
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/v23/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/v23/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v23/import.log"
      - name: Render genuine viewport and validate nine PNG cases
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v prefix 'v23_%s_%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          echo "V23_CAPTURE_PREFIX=$prefix" >> "$GITHUB_ENV"
          timeout 180s xvfb-run -a -s "-screen 0 1920x1080x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --script res://tests/capture_p4_v23_layout.gd -- \
            "--capture-prefix=$prefix" > "$RUNNER_TEMP/v23/render.log" 2>&1 || {
              cat "$RUNNER_TEMP/v23/render.log"; exit 1;
            }
          grep -E '^(V23_CAPTURE_REPORT |PASS V23-|FAIL V23-)' "$RUNNER_TEMP/v23/render.log"
          grep -qx 'V23_CAPTURE_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/v23/render.log"
          ! grep -E 'SCRIPT ERROR|^FAIL ' "$RUNNER_TEMP/v23/render.log"
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v23/render.log"
          base="outputs/p4_input_capture/$prefix"
          test -s "$base/v23_capture_manifest.json"
          test -s "$base/v23_idle_1280_zh.png"
          test -s "$base/v23_idle_1920_en.png"
          test -s "$base/v23_selected_1280_zh.png"
          echo "V23_EVIDENCE_DIR=$base" >> "$GITHUB_ENV"
      - name: Render V3 Boss projection fixtures (no player input)
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v prefix 'v31_%s_%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          timeout 150s xvfb-run -a -s "-screen 0 1920x1080x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --script res://tests/capture_p4_v31_boss.gd -- \
            "--capture-prefix=$prefix" > "$RUNNER_TEMP/v23/boss.log" 2>&1 || {
              cat "$RUNNER_TEMP/v23/boss.log"; exit 1;
            }
          grep -qx 'V31_BOSS_RENDER_REPORT executed=20 passed=20 failed=0' "$RUNNER_TEMP/v23/boss.log"
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v23/boss.log"
          grep '^V31_BOSS_RENDER_REPORT' "$RUNNER_TEMP/v23/boss.log"
      - name: Final authorized V26 pending UX attempt (not V25 or P43)
        # Local attempts 1 and 2 are preserved. Run attempt 3 only on first
        # publication of this integration branch; master never reruns this GUI.
        if: github.ref == 'refs/heads/integration/v2-reviewed-20261015' && github.event.before == '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1920x1080x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --script res://tests/test_p4_v26_pending_ux.gd > "$RUNNER_TEMP/v23/v26.log" 2>&1 || {
              cat "$RUNNER_TEMP/v23/v26.log"; exit 1;
            }
          grep -qx 'V26_PENDING_UX_REPORT executed=47 passed=47 failed=0' "$RUNNER_TEMP/v23/v26.log"
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v23/v26.log"
          grep '^V26_PENDING_UX_REPORT' "$RUNNER_TEMP/v23/v26.log"
      - name: Validate 12 real PNG snapshots and both manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/validate_visual_snapshots.py \
            --base outputs/p4_input_capture \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            | tee "$RUNNER_TEMP/v23/validate.log"
          {
            echo '### Godot 4.7.2 — Real Battle Screenshot Evidence'
            echo ''
            echo '- 9 genuine HUD captures (zh_TW/en, 1280x720 and 1920x1080, varying hand size).'
            echo '- 3 genuine Boss Break/Locked projection fixtures (not gameplay oracles).'
            echo '- PNG integrity, resolutions, renderer metadata and both manifests validated.'
            echo "- [Download PNGs, JPEG previews, JSON manifests and logs in Artifacts](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
            echo ''
            echo 'These are genuine rendered screenshots; no pixel-baseline similarity gate is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: P6 Visual Regression - compare or prepare approval report
        shell: bash
        run: |
          set -Eeuo pipefail
          output="outputs/visual_regression/p6_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output"
          status=0
          python3 tools/ci/compare_visual_snapshots.py \
            --captures outputs/p4_input_capture \
            --baseline tests/visual_baselines/approved.json \
            --output "$output" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            | tee "$RUNNER_TEMP/v23/regression.log" || status=$?
          if [ -s "$output/visual_regression_summary.md" ]; then
            cat "$output/visual_regression_summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Preserve runner logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v base 'outputs/p4_input_capture/v23_%s_%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          mkdir -p "$base/runner_logs"
          cp -f "$RUNNER_TEMP/v23/"*.log "$base/runner_logs/" 2>/dev/null || true
      - name: Upload genuine PNG snapshots, manifests and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-visual-snapshots
          path: |
            outputs/p4_input_capture/v23_*/
            outputs/p4_input_capture/v26_*/
            outputs/p4_input_capture/v31_*/
          retention-days: 14

      - name: Upload P6 visual regression report and diff heatmaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: outputs/visual_regression/p6_*/
          if-no-files-found: warn
          retention-days: 14
