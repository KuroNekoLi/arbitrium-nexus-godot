name: Godot P4 reviewed headless slice
on:
  push:
    branches: [master, 'integration/p4-approved-headless-slice-20261015']
    paths:
      - '.github/workflows/godot-p4-reviewed-headless.yml'
      - 'scripts/domain/**'
      - 'tests/test_lv40_content.gd'
      - 'tests/test_p4_balance_metrics.gd'
      - 'tests/test_p4_profile_metrics.gd'
      - 'tests/profile_p4.gd'
      - 'tools/balance/**'
      - 'tools/qa/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/review-logs"
          root="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$root/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$root/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          exe="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          echo "GODOT_BIN=$exe" >> "$GITHUB_ENV"
      - name: Strict import and Godot version
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/review-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/review-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/review-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/review-logs/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/review-logs/import.log"
      - name: Content, balance and profile pure headless suites
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in \
            'test_lv40_content:LV40_CONTENT_REPORT:37' \
            'test_p4_balance_metrics:P4_BALANCE_METRICS_REPORT:35' \
            'test_p4_profile_metrics:P4_PROFILE_METRICS_REPORT:30' \
            'test_m5_integration:M5_5_INTEGRATION_REPORT:32' \
            'test_m5_replay:M5_5_REPLAY_REPORT:15'; do
            IFS=: read -r script report count <<< "$spec"
            log="$RUNNER_TEMP/review-logs/$script.log"
            timeout 180s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$log" 2>&1 || {
              cat "$log"; exit 1;
            }
            grep -qx "$report executed=$count passed=$count failed=0" "$log" || {
              tail -n 100 "$log"; exit 1;
            }
            python3 tools/ci/assert_godot_logs.py "$log"
            grep -E '^((LV40|P4_|M5_)|PASS )' "$log" | tail -n 6
          done
      - name: Full M5.5 fixture seed replay regression
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/review-logs/test_m5_100_seeds.log"
          timeout 1800s "$GODOT_BIN" --headless --path . --script res://tests/test_m5_100_seeds.gd > "$log" 2>&1 || {
            tail -n 150 "$log"; exit 1;
          }
          grep -q '^M5_5_100_SEEDS_REPORT executed=110 passed=110 failed=0 runs=100 ' "$log"
          test "$(grep -c '^M5_5_SEED_REPORT seed=' "$log")" -eq 100
          python3 tools/ci/assert_godot_logs.py "$log"
          tail -n 8 "$log"
      - name: Preserve Lv40 domain/edges exhausted attempt budget
        run: |
          echo 'test_lv40_domain 83/83 previous attempt #3 in integration evidence; not rerun'
          echo 'test_lv40_edges 37/37 previous attempt #3 at Actions #38714794598; not rerun'
      - name: Upload logs even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-reviewed-headless-logs
          path: ${{ runner.temp }}/review-logs/
          retention-days: 14
