name: Godot V2.4 Hand Contracts
on:
  push:
    branches: ['ui/v2-layout-fidelity-20261015']
    paths:
      - '.github/workflows/godot-v2-4-hand-headless.yml'
      - 'scripts/battle/ui/**'
      - 'scripts/battle/battle_screen.gd'
      - 'tests/test_p4_v24_hand.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hand-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install official SHA512-verified Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/v24"
          root="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$root/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$root/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Strict import and V2.4 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/v24/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/v24/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v24/import.log"
          for spec in \
            'test_p4_scene:P4_1_REPORT:8' \
            'test_p4_hud:P4_2_REPORT:36' \
            'test_p4_component_contract:V1_COMPONENT_REPORT:24' \
            'test_p4_v2_layout:V2_LAYOUT_REPORT:18' \
            'test_p4_v2_context_layout:V2_CONTEXT_REPORT:23' \
            'test_p4_integration:P4_3_REPORT:31' \
            'test_p4_localization:P4_LOCALIZATION_REPORT:198' \
            'test_p4_lv40_playable:P4_LV40_PLAYABLE_REPORT:32' \
            'test_p4_v24_hand:V24_HAND_REPORT:dynamic'; do
            IFS=: read -r script label count <<< "$spec"
            log="$RUNNER_TEMP/v24/$script.log"
            timeout 180s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$log" 2>&1 || {
              cat "$log"; exit 1;
            }
            if [ "$count" = dynamic ]; then
              summary="$(grep -E "^V24_HAND_REPORT executed=[0-9]+ passed=[0-9]+ failed=[0-9]+$" "$log" | tail -1)"
              python3 -c 'import sys,re; m=re.fullmatch(r"V24_HAND_REPORT executed=(\d+) passed=(\d+) failed=(\d+)",sys.argv[1]); assert m and int(m[1])>=35 and m[1]==m[2] and m[3]=="0"' "$summary"
            else
              grep -qx "$label executed=$count passed=$count failed=0" "$log" || {
                cat "$log"; exit 1;
              }
            fi
            python3 tools/ci/assert_godot_logs.py "$log"
            grep "^$label" "$log"
          done
      - name: Preserve P4.4 GUI blocker
        run: echo 'No historical P4.4 input GUI rerun'
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-hand-headless-logs
          path: ${{ runner.temp }}/v24/
          retention-days: 14

