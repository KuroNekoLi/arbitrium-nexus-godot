name: Three Ally KO and Last Spell Retirement
on:
  push:
    branches: ['ui/v3-visual-foundation-20261015']
    paths:
      - '.github/workflows/godot-three-ally-retirement.yml'
      - 'tests/test_p4_last_spell_retirement.gd'
      - 'scripts/battle/presentation/battle_actor.gd'
      - 'scripts/battle/battle_screen.gd'
      - 'scripts/ui/hero_roster_item.gd'
      - 'scripts/domain/m4/last_spell/last_spell_resolver.gd'
      - 'scripts/domain/m5/status/hp_lifecycle_bridge.gd'
      - 'scripts/domain/m5/integration/m5_domain_resolver.gd'
      - 'scripts/domain/m5/lv40/lv40_card_resolver.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          root="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$root/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$root/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -name 'Godot_v4.7.2-stable_linux.x86_64' -type f -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Strict import and retirement contract
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit > import.log 2>&1 || { cat import.log; exit 1; }
          python3 tools/ci/assert_godot_logs.py import.log
          for script in test_p4_last_spell_retirement test_p4_component_contract test_p4_hud; do
            "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$script.log" 2>&1 || { cat "$script.log"; exit 1; }
            cat "$script.log" | grep -E 'REPORT executed='
            python3 tools/ci/assert_godot_logs.py "$script.log"
            ! grep -E '^FAIL |SCRIPT ERROR' "$script.log"
          done
          python3 - <<'PY'
          import re
          data=open("test_p4_last_spell_retirement.log").read()
          m=re.search(r'^RETIREMENT_REPORT executed=(\d+) passed=(\d+) failed=(\d+)$',data,re.M)
          assert m and int(m[1])>=20 and m[1]==m[2] and int(m[3])==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-regression-logs
          path: |
            import.log
            test_p4_last_spell_retirement.log
            test_p4_component_contract.log
            test_p4_hud.log
