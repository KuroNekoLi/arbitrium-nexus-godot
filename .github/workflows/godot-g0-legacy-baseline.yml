name: Godot G0.1 - legacy headless baseline

# This workflow validates ONLY the existing prototype's test runner.
# Passing it does NOT certify Phase 1/2 combat rules or M1-M5.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-headless-baseline:
    name: Legacy smoke and failure-exit probe (not Phase 1/2 acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_RELEASE_TAG: "4.7.2-stable"
      GODOT_ZIP: "Godot_v4.7.2-stable_linux.x86_64.zip"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official Godot and verify SHA-512
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}"
          curl -fLsS --retry 3 --retry-delay 2 "$URL/${GODOT_ZIP}" -o "$RUNNER_TEMP/godot/${GODOT_ZIP}"
          curl -fLsS --retry 3 --retry-delay 2 "$URL/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "${GODOT_ZIP}" SHA512-SUMS.txt > godot-selected.sha512
          test "$(wc -l < godot-selected.sha512)" -eq 1
          sha512sum --check godot-selected.sha512
          unzip -q "${GODOT_ZIP}" -d extracted
          BIN="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          printf 'GODOT_BIN=%s\n' "$BIN" >> "$GITHUB_ENV"

      - name: Verify engine version and import project
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f project.godot
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/godot-version.txt"
          mkdir -p "$RUNNER_TEMP/g0-logs"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/g0-logs/editor-import.log" 2>&1 || {
            cat "$RUNNER_TEMP/g0-logs/editor-import.log"
            exit 1
          }
          cat "$RUNNER_TEMP/g0-logs/editor-import.log"

      - name: Verify intentional failure is detected (exit code 17)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          timeout 60s "$GODOT_BIN" --headless --path . --script res://tests/ci_failure_probe.gd > "$RUNNER_TEMP/g0-logs/negative-probe.log" 2>&1
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/g0-logs/negative-probe.log"
          echo "Negative probe process exit: $CODE"
          if [[ "$CODE" -ne 17 ]]; then
            echo "::error::The intentional failure must exit with code 17, got $CODE"
            exit 1
          fi
          if ! grep -q 'G0_PROBE_EXPECTED_FAILURE' "$RUNNER_TEMP/g0-logs/negative-probe.log"; then
            echo "::error::Probe marker missing; nonzero result may be an unexpected engine crash"
            exit 1
          fi

      - name: Run existing legacy tests (preserve their existing assertions)
        shell: bash
        run: |
          set -Eeuo pipefail
          overall=0
          {
            echo "## G0.1 existing-prototype tests"
            echo "These tests assert the LEGACY 8-card, 2-play and timed-Reaction behavior."
            echo "They do not validate the new Phase 1/2 spec."
            echo ""
            echo "| Test | Exit code |"
            echo "|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for script in test_battle_state test_deck_builder test_combat_ui test_turn_flow; do
            set +e
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/${script}.gd" > "$RUNNER_TEMP/g0-logs/${script}.log" 2>&1
            code=$?
            set -e
            echo "::group::${script} [exit ${code}]"
            cat "$RUNNER_TEMP/g0-logs/${script}.log"
            echo "::endgroup::"
            echo "| ${script} | ${code} |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$code" -ne 0 ]]; then
              echo "::error::Legacy test ${script} failed (exit ${code})"
              overall=1
            fi
          done
          exit "$overall"

      - name: Upload complete CI evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-g0-legacy-headless-logs
          path: |
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/g0-logs/
          if-no-files-found: warn
          retention-days: 14
