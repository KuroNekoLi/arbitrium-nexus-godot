name: Godot Phase3 M3.5 Full Integration and Regression
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/godot-m3-5-integration.yml'
      - 'scripts/domain/m3/**'
      - 'scripts/domain/m2/integration/m2_domain_resolver.gd'
      - 'scripts/domain/m2/economy/resource_ledger.gd'
      - 'tests/test_m3_integration.gd'
      - 'tests/test_m3_replay.gd'
      - 'tests/fixtures/m3_5_*'
      - 'scripts/domain/m3/integration/**'
      - 'docs/verification/PH3_M3_5_ACCEPTANCE_REPORT.md'
  pull_request:
    paths:
      - '.github/workflows/godot-m3-5-integration.yml'
      - 'scripts/domain/m3/**'
      - 'scripts/domain/m2/integration/**'
      - 'scripts/domain/m2/economy/resource_ledger.gd'
      - 'tests/test_m3_integration.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-5-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA512 verified official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m3-5-logs"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$release/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Verify version and import project
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m3-5-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m3-5-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m3-5-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m3-5-logs/import.log"; exit 1;
          }
      - name: M3.5 two-round integrated acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m3_integration.gd > "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log" 2>&1 || {
            cat "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log"
          grep -Eq '^M3_5_INTEGRATION_REPORT executed=[0-9]+ passed=[0-9]+ failed=0$' "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log"
          for oracle in M35-END2END-COMPLETE M35-END2END-REAL_M2_CARD_ZONES PH3-M3-QUEUE-001 PH3-M3-PROTECT-001 M35-AOE-GUARD1RP M35-RP_ZERO-EMPTY_WINDOW P1-D01-PLAYER_ACTION_ORDER_AABA; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log"
          done
          grep -q '^M3_5_INTEGRATION_ACCEPTED$' "$RUNNER_TEMP/m3-5-logs/test_m3_integration.log"
      - name: M3.5 seeded full replay acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m3_replay.gd > "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log" 2>&1 || {
            cat "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log"
          grep -Eq '^M3_5_REPLAY_REPORT executed=[0-9]+ passed=[0-9]+ failed=0$' "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log"
          for oracle in M35-REPLAY-EXACT_FINAL_STATE M35-REPLAY-EXACT_EVENT_HASH M35-REPLAY-THREE_MODES_FINAL_STATE_EQUAL M35-REPLAY-THREE_MODES_EVENT_HASH_EQUAL M35-REPLAY-DUPLICATE_ID_REJECTED M35-REPLAY-NO_PREMATURE_ACTION; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log"
          done
          grep -q '^M3_5_REPLAY_ACCEPTED$' "$RUNNER_TEMP/m3-5-logs/test_m3_replay.log"
      - name: M3.4 M3.3 M3.2 M3.1 and M1-M2 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_m3_ui_modes test_m3_guard_protect test_m3_reaction_window test_m3_phase test_combat_m1 test_m2_resources test_m2_costs test_m2_cards test_m2_free_swap test_m2_invariants test_m2_replay test_m2_integration; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m3-5-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m3-5-logs/$script.log"; exit 1;
            }
          done
          grep -q 'M3_4_TEST_REPORT executed=83 passed=83 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_ui_modes.log"
          grep -q '^M3_4_PRESENTATION_POLICY_DOMAIN_VERIFIED executed=54 passed=54 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_guard_protect.log"
          grep -q 'M3_2_TEST_REPORT executed=50 passed=50 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_reaction_window.log"
          grep -q 'M3_1_TEST_REPORT executed=61 passed=61 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_phase.log"
          grep -q 'M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m3-5-logs/test_combat_m1.log"
          grep -q 'M2_1_TEST_REPORT executed=38 passed=38 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_resources.log"
          grep -q 'M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_costs.log"
          grep -q 'M2_3_TEST_REPORT executed=46 passed=46 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_cards.log"
          grep -q 'M2_4_TEST_REPORT executed=32 passed=32 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_free_swap.log"
          grep -q 'M2_5_RESOURCE_ONLY_INVARIANTS_REPORT executed=14 passed=14 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_invariants.log"
          grep -q 'M2_5_RESOURCE_ONLY_REPLAY_REPORT executed=6 passed=6 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_replay.log"
          grep -q 'M2_5_INTEGRATION_REPORT executed=40 passed=40 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_integration.log"
      - name: Legacy regression smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_battle_state test_deck_builder test_combat_ui test_turn_flow; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m3-5-logs/legacy-$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m3-5-logs/legacy-$script.log"; exit 1;
            }
          done
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m3-5-integration-logs
          path: ${{ runner.temp }}/m3-5-logs/
          retention-days: 14
 "$RUNNER_TEMP/m3-5-logs/test_m3_ui_modes.log"
          grep -q 'M3_3_TEST_REPORT executed=54 passed=54 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_guard_protect.log"
          grep -q 'M3_2_TEST_REPORT executed=50 passed=50 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_reaction_window.log"
          grep -q 'M3_1_TEST_REPORT executed=61 passed=61 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m3_phase.log"
          grep -q 'M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m3-5-logs/test_combat_m1.log"
          grep -q 'M2_1_TEST_REPORT executed=38 passed=38 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_resources.log"
          grep -q 'M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_costs.log"
          grep -q 'M2_3_TEST_REPORT executed=46 passed=46 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_cards.log"
          grep -q 'M2_4_TEST_REPORT executed=32 passed=32 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_free_swap.log"
          grep -q 'M2_5_RESOURCE_ONLY_INVARIANTS_REPORT executed=14 passed=14 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_invariants.log"
          grep -q 'M2_5_RESOURCE_ONLY_REPLAY_REPORT executed=6 passed=6 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_replay.log"
          grep -q 'M2_5_INTEGRATION_REPORT executed=40 passed=40 failed=0' "$RUNNER_TEMP/m3-5-logs/test_m2_integration.log"
      - name: Legacy regression smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_battle_state test_deck_builder test_combat_ui test_turn_flow; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m3-5-logs/legacy-$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m3-5-logs/legacy-$script.log"; exit 1;
            }
          done
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m3-5-integration-logs
          path: ${{ runner.temp }}/m3-5-logs/
          retention-days: 14
