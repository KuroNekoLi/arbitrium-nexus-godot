name: CI Full - 100 Battles and 1238 Assertions
on:
  schedule:
    # 02:00 Asia/Taipei (18:00 UTC) daily
    - cron: '0 18 * * *'
  # Run a full gate manually on release candidates or before risky merges.
  workflow_dispatch:
  # Evidence after publication; a published release is not a pre-release gate.
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-m5-5:
    # Reuse the canonical 1238/1238 + 100-seed + replay + 4 smoke suite.
    # No second 100-seed runner and no new/relaxed acceptance oracles.
    uses: ./.github/workflows/godot-m5-5-acceptance.yml
