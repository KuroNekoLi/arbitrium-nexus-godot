name: Godot Character Editor Preview - New QA Contract
on:
  # Remains manual to preserve test attempt accounting.
  # Owner approved a new <=3-attempt batch on 2026-10-16; local attempts 1/2
  # passed (35/35 then 39/39); the next manual run is attempt 3.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache/godot-4.7.2
          key: godot-4.7.2-linux-x86_64-verified-v1
      - name: Install Godot 4.7.2 verified
        run: bash tools/ci/install_godot.sh
      - name: Strict Godot editor import
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/character-preview"
          # GitPlugin is a Windows editor setting, unavailable on Linux CI.
          # Remove it only in this disposable checkout, NOT from tracked project.godot.
          sed -i '/^version_control\/plugin_name=/d; /^version_control\/autoload_on_startup=/d' project.godot
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/character-preview/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/character-preview/import.log"; exit 1;
          }
          grep -n -B2 -A4 -E 'SCRIPT ERROR|^ERROR:' "$RUNNER_TEMP/character-preview/import.log" || true
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/character-preview/import.log"
      - name: Character appearance and editor isolation suite (39 assertions)
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/character-preview/test_character_editor_preview.log"
          timeout 150s "$GODOT_BIN" --headless --path . --script res://tests/test_character_editor_preview.gd > "$log" 2>&1 || {
            cat "$log"; exit 1;
          }
          cat "$log"
          grep -Fxq 'CHARACTER_EDITOR_PREVIEW_REPORT executed=39 passed=39 failed=0' "$log"
          python3 tools/ci/assert_godot_logs.py "$log"
      - name: Preserve historical GUI test quota
        run: echo 'No Last Spell 29-case or old GUI test was rerun; this is a NEW asset/editor group.'
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-editor-preview-qa
          path: ${{ runner.temp }}/character-preview/
          retention-days: 14
