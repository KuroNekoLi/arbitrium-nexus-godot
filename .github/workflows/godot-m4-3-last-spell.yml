name: Godot Phase3 M4.3 Last Spell Engine
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  m4-3-last-spell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA512 verified official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m4-3-logs"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$release/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Verify version and import project
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m4-3-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m4-3-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m4-3-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m4-3-logs/import.log"; exit 1;
          }
      - name: M4.3 Last Spell independent Domain acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_last_spell.gd > "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log" 2>&1 || {
            cat "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log"
          grep -Eq '^M4_3_TEST_REPORT executed=[0-9]+ passed=[0-9]+ failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log"
          for oracle in LAST-001-ONCE_USED_COMMITTED LAST-001-NO_CARD_ZONE_MOVEMENT LAST-003-ONE_DELAY_USED LAST-004-SECOND_DISRUPTION_WEAKENS LAST-004-NO_INFINITE_DELAY_OR_STACKING LAST-005-RELEASE_ONCE_AT_ROUND4 LAST-005-ACTOR_EXHAUSTED LAST-005-BASE_AP_STILL_SIX LAST-REPLAY-SAME_SEED_FINAL LAST-REPLAY-SAME_SEED_EVENTS; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log"
          done
          grep -q '^M4_3_LAST_SPELL_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m4-3-logs/test_m4_last_spell.log"
      - name: M4.2 preceding Disruption regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_disruption.gd > "$RUNNER_TEMP/m4-3-logs/test_m4_disruption.log" 2>&1 || {
            cat "$RUNNER_TEMP/m4-3-logs/test_m4_disruption.log"; exit 1;
          }
          grep -q '^M4_2_TEST_REPORT executed=59 passed=59 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m4_disruption.log"
          grep -q '^M4_2_DISRUPTION_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m4-3-logs/test_m4_disruption.log"
      - name: M4.1 predecessor regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_dual_cast.gd > "$RUNNER_TEMP/m4-3-logs/test_m4_dual_cast.log" 2>&1 || {
            cat "$RUNNER_TEMP/m4-3-logs/test_m4_dual_cast.log"; exit 1;
          }
          grep -q '^M4_1_TEST_REPORT executed=47 passed=47 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m4_dual_cast.log"
      - name: M3.5 integration and replay regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_m3_integration test_m3_replay; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m4-3-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m4-3-logs/$script.log"; exit 1;
            }
          done
          grep -q '^M3_5_INTEGRATION_REPORT executed=61 passed=61 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_integration.log"
          grep -q '^M3_5_REPLAY_REPORT executed=40 passed=40 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_replay.log"
      - name: Full M3.4 through M1-M2 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_m3_ui_modes test_m3_guard_protect test_m3_reaction_window test_m3_phase test_combat_m1 test_m2_resources test_m2_costs test_m2_cards test_m2_free_swap test_m2_invariants test_m2_replay test_m2_integration; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m4-3-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m4-3-logs/$script.log"; exit 1;
            }
          done
          grep -q '^M3_4_TEST_REPORT executed=83 passed=83 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_ui_modes.log"
          grep -q '^M3_4_PRESENTATION_POLICY_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m4-3-logs/test_m3_ui_modes.log"
          grep -q '^M3_3_TEST_REPORT executed=54 passed=54 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_guard_protect.log"
          grep -q '^M3_2_TEST_REPORT executed=50 passed=50 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_reaction_window.log"
          grep -q '^M3_1_TEST_REPORT executed=61 passed=61 failed=0$' "$RUNNER_TEMP/m4-3-logs/test_m3_phase.log"
          grep -q '^M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m4-3-logs/test_combat_m1.log"
          grep -q '^M2_1_TEST_REPORT executed=38 passed=38 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_resources.log"
          grep -q '^M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_costs.log"
          grep -q '^M2_3_TEST_REPORT executed=46 passed=46 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_cards.log"
          grep -q '^M2_4_TEST_REPORT executed=32 passed=32 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_free_swap.log"
          grep -q '^M2_5_RESOURCE_ONLY_INVARIANTS_REPORT executed=14 passed=14 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_invariants.log"
          grep -q '^M2_5_RESOURCE_ONLY_REPLAY_REPORT executed=6 passed=6 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_replay.log"
          grep -q '^M2_5_INTEGRATION_REPORT executed=40 passed=40 failed=0' "$RUNNER_TEMP/m4-3-logs/test_m2_integration.log"
      - name: Legacy prototype regression smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_battle_state test_deck_builder test_combat_ui test_turn_flow; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m4-3-logs/legacy-$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m4-3-logs/legacy-$script.log"; exit 1;
            }
          done
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m4-3-last-spell-logs
          path: ${{ runner.temp }}/m4-3-logs/
          retention-days: 14
