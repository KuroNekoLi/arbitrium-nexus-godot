name: Godot Phase3 M2.3 card domain acceptance
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  m2-3-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m2-3-logs"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$release/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Godot version and import
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m2-3-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m2-3-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m2-3-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-3-logs/import.log"; exit 1;
          }
      - name: M2.3 card-domain acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_m2_cards.gd > "$RUNNER_TEMP/m2-3-logs/test_m2_cards.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-3-logs/test_m2_cards.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m2-3-logs/test_m2_cards.log"
          grep -Eq '^M2_3_TEST_REPORT executed=[0-9]+ passed=[0-9]+ failed=0' "$RUNNER_TEMP/m2-3-logs/test_m2_cards.log"
          grep -q '^M2_3_CARD_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m2-3-logs/test_m2_cards.log"
      - name: M1 M2.1 M2.2 predecessor regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_combat_m1 test_m2_resources test_m2_costs; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m2-3-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m2-3-logs/$script.log"; exit 1;
            }
          done
          grep -q 'M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m2-3-logs/test_combat_m1.log"
          grep -q 'M2_1_TEST_REPORT executed=38 passed=38 failed=0' "$RUNNER_TEMP/m2-3-logs/test_m2_resources.log"
          grep -q 'M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m2-3-logs/test_m2_costs.log"
      - name: Upload M2.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-m2-3-card-domain-logs
          path: ${{ runner.temp }}/m2-3-logs/
          retention-days: 14
