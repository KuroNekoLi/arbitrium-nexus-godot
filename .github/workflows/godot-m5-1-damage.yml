          grep -q '^M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_costs.log"
          grep -q '^M2_3_TEST_REPORT executed=46 passed=46 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_cards.log"
          grep -q '^M2_4_TEST_REPORT executed=32 passed=32 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_free_swap.log"
          grep -q '^M2_5_RESOURCE_ONLY_INVARIANTS_REPORT executed=14 passed=14 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_invariants.log"
          grep -q '^M2_5_RESOURCE_ONLY_REPLAY_REPORT executed=6 passed=6 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_replay.log"
          grep -q '^M2_5_INTEGRATION_REPORT executed=40 passed=40 failed=0' "$RUNNER_TEMP/m5-1-logs/test_m2_integration.log"
      - name: Legacy prototype regression smoke
