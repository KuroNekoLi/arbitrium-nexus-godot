name: Godot Phase3 M5.1 Real Hit Crit Damage Acceptance
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/godot-m5-1-damage.yml'
      - 'scripts/domain/m5/**'
      - 'scripts/domain/m3/phase/phase_engine.gd'
      - 'scripts/domain/m4/integration/m4_domain_resolver.gd'
      - 'scripts/domain/m4/casting/casting_timeline_resolver.gd'
      - 'tests/fixtures/m5_1_fixture.gd'
      - 'tests/test_m5_damage.gd'
      - 'docs/verification/PH3_M5_1_ENGINEERING_NOTE.md'
  pull_request:
    paths:
      - '.github/workflows/godot-m5-1-damage.yml'
      - 'scripts/domain/m5/**'
      - 'scripts/domain/m3/**'
      - 'scripts/domain/m4/**'
      - 'tests/test_m5_damage.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m5-1-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA512 verified official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m5-1-logs"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$release/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Verify version and import project
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m5-1-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m5-1-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m5-1-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/import.log"; exit 1;
          }
      - name: M5.1 real Hit Crit Damage and authentic HP acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_m5_damage.gd > "$RUNNER_TEMP/m5-1-logs/test_m5_damage.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m5_damage.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m5-1-logs/test_m5_damage.log"
          grep -q '^M5_1_TEST_REPORT executed=44 passed=44 failed=0
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_integration.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log"
          grep -Eq '^M4_5_INTEGRATION_REPORT executed=[0-9]+ passed=[0-9]+ failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log"
          for oracle in M45-INT-11-CONCENTRATING_CAST_COMPATIBLE_PAID M45-INT-15-ON_HIT_SUPPRESSED_AFTER_PROTECT M45-INT-16-DIRECT_BYPASSES_PROTECT M45-INT-20-RELEASE_BEFORE_AP_AND_DRAW M45-INT-23-R2_PROTECT_FRESH_WINDOW M45-INT-29-CORE02_STRICT_CHAIN M45-INT-32-T4_NO_RESURRECTED_LAST_EFFECT M45-INT-34-REVIVE_NOT_RESTORE_LAST; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log"
          done
          grep -q '^M4_5_INTEGRATION_DOMAIN_ACCEPTED$' "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log"
      - name: M4.5 canonical replay and negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_replay.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log"
          grep -Eq '^M4_5_REPLAY_REPORT executed=[0-9]+ passed=[0-9]+ failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log"
          for oracle in M45-REP-02-FINAL_STATE_EQUAL M45-REP-04-REPEATED_SAME_SEED_EVENTS M45-REP-06-OUTER_EVENT_SEQUENCE_MONOTONIC M45-REP-25-SMART_NO_DOMAIN_MUTATION M45-REP-27-ALL_UI_MODES_EQUAL_EVENTS M45-REP-29-STALE_TAPE_FAILS_CLOSED M45-REP-31-DUPLICATE_COMMAND_REJECTED M45-REP-32-HIT_AUTHORIZATION_NOT_SKIPPED; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log"
          done
          grep -q '^M4_5_REPLAY_DOMAIN_ACCEPTED$' "$RUNNER_TEMP/m5-1-logs/test_m4_replay.log"
      - name: M4.4 CORE-02 predecessor regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_incapacitation.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_incapacitation.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m4_incapacitation.log"; exit 1;
          }
          grep -q '^M4_4_TEST_REPORT executed=59 passed=59 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m4_incapacitation.log"
          grep -q '^M4_4_INVALIDATION_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m5-1-logs/test_m4_incapacitation.log"
      - name: M4.3 Last Spell predecessor regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 65s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_last_spell.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_last_spell.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m4_last_spell.log"; exit 1;
          }
          grep -q '^M4_3_TEST_REPORT executed=55 passed=55 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m4_last_spell.log"
          grep -q '^M4_3_LAST_SPELL_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m5-1-logs/test_m4_last_spell.log"
      - name: M4.2 preceding Disruption regression
        shell: bash
        run: |
          set -Eeuo pipefail
