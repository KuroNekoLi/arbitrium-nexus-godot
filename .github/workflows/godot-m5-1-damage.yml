          grep -q '^M4_1_TEST_REPORT executed=47 passed=47 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m4_dual_cast.log"
      - name: M3.5 integration and replay regression
        shell: bash
        run: |
          set -Eeuo pipefail
