          grep -q '^M4_2_DISRUPTION_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m5-1-logs/test_m4_disruption.log"
      - name: M4.1 predecessor regression
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_dual_cast.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_dual_cast.log" 2>&1 || {
            cat "$RUNNER_TEMP/m5-1-logs/test_m4_dual_cast.log"; exit 1;
