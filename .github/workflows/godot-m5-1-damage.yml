          done
          grep -q '^M3_4_TEST_REPORT executed=83 passed=83 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m3_ui_modes.log"
          grep -q '^M3_4_PRESENTATION_POLICY_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m5-1-logs/test_m3_ui_modes.log"
          grep -q '^M3_3_TEST_REPORT executed=54 passed=54 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m3_guard_protect.log"
          grep -q '^M3_2_TEST_REPORT executed=50 passed=50 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m3_reaction_window.log"
