          done
          grep -q '^M3_5_INTEGRATION_REPORT executed=61 passed=61 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m3_integration.log"
          grep -q '^M3_5_REPLAY_REPORT executed=40 passed=40 failed=0$' "$RUNNER_TEMP/m5-1-logs/test_m3_replay.log"
      - name: Full M3.4 through M1-M2 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_m3_ui_modes test_m3_guard_protect test_m3_reaction_window test_m3_phase test_combat_m1 test_m2_resources test_m2_costs test_m2_cards test_m2_free_swap test_m2_invariants test_m2_replay test_m2_integration; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m5-1-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m5-1-logs/$script.log"; exit 1;
