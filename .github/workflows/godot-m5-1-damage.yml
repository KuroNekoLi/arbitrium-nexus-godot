              cat "$RUNNER_TEMP/m5-1-logs/legacy-$script.log"; exit 1;
            }
          done
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-phase3-m5-1-damage-logs
          path: ${{ runner.temp }}/m5-1-logs/
          retention-days: 14
 "$RUNNER_TEMP/m5-1-logs/test_m5_damage.log"
          for oracle in M51-07-HIT_CLAMP_05 M51-13-ONE_TRACE_ONE_HP_EVENT M51-17-PROTECT_USES_RECIPIENT_DEFENSE M51-19-GUARD_THEN_BARRIER M51-24-REAL_HP0_CALLS_M4_INVALIDATOR M51-25-CHANTLESS_REAL_DAMAGE_BEFORE_OUTCOME M51-32-ENEMY_ACTION_REAL_TWO_HITS M51-36-FULL_RELEASE_BEFORE_AP_DRAW M51-40-SAME_TAPE_EVENT_HASH M51-41-SAME_TAPE_FINAL_HASH; do
            grep -q "^PASS $oracle$" "$RUNNER_TEMP/m5-1-logs/test_m5_damage.log"
          done
          grep -q '^M5_1_DAMAGE_DOMAIN_VERIFIED
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s "$GODOT_BIN" --headless --path . --script res://tests/test_m4_integration.gd > "$RUNNER_TEMP/m5-1-logs/test_m4_integration.log" 2>&1 || {
