name: Godot V3.3 Boss HUD and Intent Contract
on:
  push:
    branches: ['ui/v3-visual-foundation-20261015']
    paths:
      - '.github/workflows/godot-v3-3-boss-intent.yml'
      - 'scripts/battle/ui/components/enemy_status_panel.gd'
      - 'scripts/battle/ui/components/battle_visual_tokens.gd'
      - 'tests/test_p4_v33_boss.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v33-boss:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA512-verified official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/v33"
          root="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$root/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$root/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Strict import, V1-V3 regressions and Boss display geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/v33/import.log" 2>&1 || { cat "$RUNNER_TEMP/v33/import.log"; exit 1; }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/v33/import.log"
          for spec in \
            'test_p4_scene:P4_1_REPORT:8' \
            'test_p4_hud:P4_2_REPORT:36' \
            'test_p4_component_contract:V1_COMPONENT_REPORT:24' \
            'test_p4_v2_layout:V2_LAYOUT_REPORT:18' \
            'test_p4_v2_context_layout:V2_CONTEXT_REPORT:23' \
            'test_p4_v24_hand:V24_HAND_REPORT:39' \
            'test_p4_integration:P4_3_REPORT:31' \
            'test_p4_localization:P4_LOCALIZATION_REPORT:198' \
            'test_p4_lv40_playable:P4_LV40_PLAYABLE_REPORT:32' \
            'test_p4_v31_visual:V31_VISUAL_REPORT:31' \
            'test_p4_v32_card:V32_CARD_REPORT:73' \
            'test_p4_v33_boss:V33_BOSS_REPORT:dynamic'; do
            IFS=: read -r script label count <<< "$spec"
            log="$RUNNER_TEMP/v33/$script.log"
            timeout 180s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$log" 2>&1 || { cat "$log"; exit 1; }
            if [ "$count" = dynamic ]; then
              summary="$(grep -E "^V33_BOSS_REPORT executed=[0-9]+ passed=[0-9]+ failed=[0-9]+$" "$log" | tail -1)"
              python3 -c 'import re,sys; m=re.fullmatch(r"V33_BOSS_REPORT executed=(\d+) passed=(\d+) failed=(\d+)",sys.argv[1]); assert m and int(m[1])>=40 and m[1]==m[2] and m[3]=="0"' "$summary"
            else
              grep -qx "$label executed=$count passed=$count failed=0" "$log" || { cat "$log"; exit 1; }
            fi
            python3 tools/ci/assert_godot_logs.py "$log"
            grep "^$label" "$log"
          done
      - name: Preserve strict engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-boss-headless-evidence
          path: ${{ runner.temp }}/v33/
          retention-days: 14

