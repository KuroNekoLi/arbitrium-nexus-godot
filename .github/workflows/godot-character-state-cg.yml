name: Godot Three-Hero Character State CG
on:
  push:
    branches: ['ui/character-state-cg-20261016', master]
    paths:
      - '.github/workflows/godot-character-state-cg.yml'
      - 'tests/test_p4_character_state_cg.gd'
      - 'scripts/battle/presentation/character_appearance_registry.gd'
      - 'scripts/battle/presentation/battle_actor.gd'
      - 'scripts/battle/ui/components/party_status_panel.gd'
      - 'assets/characters/**/cg_states.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-cg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-ci
      - name: Fresh import and strict 39-case character-state contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/state-cg"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/state-cg/import.log" 2>&1
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/state-cg/import.log"
          bash tools/ci/run_suite.sh 'test_p4_character_state_cg:STATE_CG_REPORT:39' "$RUNNER_TEMP/state-cg"
          echo 'Character state contract only. Canonical Visual workflows retain screenshot gates; no Combo GUI/Domain rerun.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-state-cg-headless
          path: ${{ runner.temp }}/state-cg/
          retention-days: 14