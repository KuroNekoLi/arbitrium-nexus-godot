name: Godot Phase3 M2.4 Free Swap domain acceptance
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/godot-m2-free-swap.yml'
      - 'scripts/domain/m2/cards/**'
      - 'tests/test_m2_free_swap.gd'
      - 'tests/test_m2_cards.gd'
  pull_request:
    paths:
      - '.github/workflows/godot-m2-free-swap.yml'
      - 'scripts/domain/m2/cards/**'
      - 'tests/test_m2_free_swap.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m2-4-free-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 and verify hash
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/m2-4-logs"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$release/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Import under verified Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/m2-4-logs/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/m2-4-logs/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/m2-4-logs/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-4-logs/import.log"; exit 1;
          }
      - name: Execute M2.4 authoritative Free Swap and trigger tests
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s "$GODOT_BIN" --headless --path . --script res://tests/test_m2_free_swap.gd > "$RUNNER_TEMP/m2-4-logs/test_m2_free_swap.log" 2>&1 || {
            cat "$RUNNER_TEMP/m2-4-logs/test_m2_free_swap.log"; exit 1;
          }
          cat "$RUNNER_TEMP/m2-4-logs/test_m2_free_swap.log"
          grep -Eq '^M2_4_TEST_REPORT executed=[0-9]+ passed=[0-9]+ failed=0' "$RUNNER_TEMP/m2-4-logs/test_m2_free_swap.log"
          grep -q '^M2_4_FREE_SWAP_DOMAIN_VERIFIED$' "$RUNNER_TEMP/m2-4-logs/test_m2_free_swap.log"
      - name: Regression M2.3 and M1/M2.1/M2.2
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_m2_cards test_combat_m1 test_m2_resources test_m2_costs; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m2-4-logs/$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m2-4-logs/$script.log"; exit 1;
            }
            echo "$script exit=0"
          done
          grep -q 'M2_3_TEST_REPORT executed=46 passed=46 failed=0' "$RUNNER_TEMP/m2-4-logs/test_m2_cards.log"
          grep -q 'M1_TEST_REPORT executed=30 passed=30 failed=0' "$RUNNER_TEMP/m2-4-logs/test_combat_m1.log"
          grep -q 'M2_1_TEST_REPORT executed=38 passed=38 failed=0' "$RUNNER_TEMP/m2-4-logs/test_m2_resources.log"
          grep -q 'M2_2_TEST_REPORT executed=43 passed=43 failed=0' "$RUNNER_TEMP/m2-4-logs/test_m2_costs.log"
      - name: Legacy prototype regression
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in test_battle_state test_deck_builder test_combat_ui test_turn_flow; do
            timeout 120s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$RUNNER_TEMP/m2-4-logs/legacy-$script.log" 2>&1 || {
              cat "$RUNNER_TEMP/m2-4-logs/legacy-$script.log"; exit 1;
            }
          done
      - name: Upload reproducible M2.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-m2-4-free-swap-logs
          path: ${{ runner.temp }}/m2-4-logs/
          retention-days: 14
