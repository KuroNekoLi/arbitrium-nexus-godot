name: Godot P4 HUD reviewed headless contracts
on:
  push:
    branches: [master, 'integration/p4-approved-hud-headless-20261015', 'integration/p4-final-playable-20261015', 'ui/v2-layout-fidelity-20261015']
    paths:
      - '.github/workflows/godot-p4-hud-headless.yml'
      - 'scripts/battle/**'
      - 'scripts/ui/**'
      - 'scenes/battle/**'
      - 'tests/test_p4_component_contract.gd'
      - 'tests/test_p4_v2_layout.gd'
      - 'tests/test_p4_feedback.gd'
      - 'tests/test_p4_feedback_edges.gd'
      - 'tests/test_p4_lv40_ui.gd'
      - 'tests/test_p4_lv40_playable.gd'
      - 'tests/test_screenshot_writer.gd'
      - 'scripts/qa/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA512 verified official Godot 4.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/p4-hud"
          root="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          zip="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$root/$zip" -o "$RUNNER_TEMP/godot/$zip"
          curl -fLsS --retry 3 "$root/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          grep -F "$zip" SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$zip" -d extracted
          bin="$(find "$RUNNER_TEMP/godot/extracted" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Strict import and source contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/p4-hud/version.log"
          grep -q '^4\.7\.2\.' "$RUNNER_TEMP/p4-hud/version.log"
          timeout 150s "$GODOT_BIN" --headless --path . --editor --import --quit > "$RUNNER_TEMP/p4-hud/import.log" 2>&1 || {
            cat "$RUNNER_TEMP/p4-hud/import.log"; exit 1;
          }
          python3 tools/ci/assert_godot_logs.py "$RUNNER_TEMP/p4-hud/import.log"
          for spec in \
            'test_p4_scene:P4_1_REPORT:8' \
            'test_p4_hud:P4_2_REPORT:36' \
            'test_p4_integration:P4_3_REPORT:31' \
            'test_p4_component_contract:V1_COMPONENT_REPORT:24' \
            'test_p4_v2_layout:V2_LAYOUT_REPORT:18' \
            'test_p4_feedback:P4_4_REPORT:45' \
            'test_p4_feedback_edges:P4_4_EDGE_REPORT:80' \
            'test_p4_lv40_ui:P4_LV40_UI_STAGING_REPORT:10' \
            'test_p4_lv40_playable:P4_LV40_PLAYABLE_REPORT:32' \
            'test_screenshot_writer:SCREENSHOT_WRITER_REPORT:46' \
            'test_p4_localization:P4_LOCALIZATION_REPORT:198' \
            'test_p4_lv40_readmodel:P4_READMODEL_REPORT:29'; do
            IFS=: read -r script label count <<< "$spec"
            log="$RUNNER_TEMP/p4-hud/$script.log"
            timeout 180s "$GODOT_BIN" --headless --path . --script "res://tests/$script.gd" > "$log" 2>&1 || {
              cat "$log"; exit 1;
            }
            grep -qx "$label executed=$count passed=$count failed=0" "$log" || {
              cat "$log"; exit 1;
            }
            python3 tools/ci/assert_godot_logs.py "$log"
            grep "^$label" "$log"
          done
      - name: Explicitly retain GUI and playable blockers
        run: |
          echo 'GUI test_p4_input_capture was 14/16 and is NOT authorized for an additional attempt.'
          echo 'No GUI_TESTED or LV40_PLAYABLE assertions are made by this job.'
          echo 'P4_LV40_UI_STAGING_REPORT asserts fail-closed, not real Lv40 battle.'
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-hud-headless-contract-logs
          path: ${{ runner.temp }}/p4-hud/
          retention-days: 14
